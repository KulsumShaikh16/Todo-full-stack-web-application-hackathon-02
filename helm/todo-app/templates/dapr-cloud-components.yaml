{{- if .Values.dapr.cloudComponents.enabled -}}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-kafka
  namespace: {{ .Release.Namespace }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "my-cluster-kafka-bootstrap.kafka:9092"
  - name: authRequired
    value: "false"
  - name: consumerGroup
    value: "todo-backend-cloud-group"
  - name: clientID
    value: "todo-backend-cloud-client"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: {{ .Release.Namespace }}
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: todo-app-secrets
      key: DATABASE_URL
{{- end -}}
